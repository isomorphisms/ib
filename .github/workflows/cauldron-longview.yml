name: Cauldron to Longview source handoff

on:
  push:
    branches: [longview-renderer-loss-acceptance]
    paths:
      - 'lib/longview_cauldron_handoff.grease'
      - 'lib/longview_source_result.grease'
      - 'lib/durable_object_store.grease'
      - 'tests/test_longview_cauldron_handoff.grease'
      - 'tests/fixtures/arxiv_site/html/**'
      - 'docs/longview-source-backed-result.md'
      - '.github/workflows/cauldron-longview.yml'

permissions:
  contents: read

jobs:
  cauldron-source-handoff:
    name: cauldron-source-handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GREASE_REF: f19c94c6df18cddbdc1e81463e5bd689533e3c13
      OILS_REF: 6d29702a10ea9eb72a43950554dbcd4174d07a89
      CAULDRON_REF: d10eeda153dae4be25fd7902338e8b8443e0666e
      REPO_ROOT: ${{ github.workspace }}/.tools/oils-source
      IB_NATIVE_GREASE: ${{ github.workspace }}/.tools/oils-source/_bin/cxx-asan/ysh
    steps:
      - name: Check out exact Longview consumer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned canonical Cauldron source producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ib
          ref: d10eeda153dae4be25fd7902338e8b8443e0666e
          path: .tools/cauldron-producer
          persist-credentials: false

      - name: Check out pinned Grease owner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/grease
          persist-credentials: false

      - name: Check out Grease's exact native source gitlink
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/oils
          ref: 6d29702a10ea9eb72a43950554dbcd4174d07a89
          path: .tools/oils-source
          persist-credentials: false

      - name: Verify all input identities before executing source
        shell: bash
        env:
          IB_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IB_EXPECTED_HEAD"
          test "$(git -C .tools/cauldron-producer rev-parse HEAD)" = "$CAULDRON_REF"
          test "$(git -C .tools/grease rev-parse HEAD)" = "$GREASE_REF"
          test "$(git -C .tools/grease rev-parse HEAD:source)" = "$OILS_REF"
          test "$(git -C .tools/oils-source rev-parse HEAD)" = "$OILS_REF"
          test "$(uname -m)" = x86_64
          podman --version
          printf 'IB=%s\nCauldron=%s\nGrease=%s\nOils=%s\n' "$IB_EXPECTED_HEAD" "$CAULDRON_REF" "$GREASE_REF" "$OILS_REF"

      - name: Establish native Grease ASAN memory mapping precondition
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build native Grease and preserve upstream spec failure details
        working-directory: .tools/oils-source
        shell: bash
        run: |
          set -euo pipefail
          # Keep the upstream failure independently visible; do not turn
          # a failing osh-all or full cpp-spec task into a passing receipt.
          upstream_status=0
          soil/github-actions.sh run-job cpp-spec podman || upstream_status=$?
          if test "$upstream_status" -eq 0; then
            soil/host-shim.sh did-all-succeed cpp-spec || upstream_status=$?
          fi
          printf '%s\n' "$upstream_status" > "$RUNNER_TEMP/grease-upstream.status"
          if test "$upstream_status" -ne 0; then
            echo "Upstream cpp-spec FAILED status=$upstream_status (preserved, not waived)." >&2
            for logfile in _tmp/soil/logs/osh-all.txt \
                           _tmp/soil/logs/ysh-all.txt \
                           _tmp/soil/logs/oils-cpp-smoke.txt; do
              if test -f "$logfile"; then
                echo "--- $logfile ---" >&2
                tail -n 90 "$logfile" >&2
              fi
            done
          fi
          test -x _bin/cxx-asan/ysh
          sha256sum _bin/cxx-asan/ysh
          _bin/cxx-asan/ysh --version

      - name: Exercise canonical producer and Longview consumer
        shell: bash
        run: |
          set -euo pipefail
          test -x "$IB_NATIVE_GREASE"
          receipt="$RUNNER_TEMP/ib-cauldron-longview.log"
          if timeout --kill-after=5 120 "$IB_NATIVE_GREASE" +O ysh:all \
              tests/test_longview_cauldron_handoff.grease .tools/cauldron-producer \
              >"$receipt" 2>&1; then
            cat "$receipt"
          else
            status=$?
            cat "$receipt" >&2
            exit "$status"
          fi
          grep -Fx \
            'Cauldron generation -> bounded E4 result test: ok (native Grease hosted; synthetic source)' \
            "$receipt"
          printf 'Cauldron producer %s verified against IB head %s\n' \
            "$CAULDRON_REF" "$(git rev-parse HEAD)"

      - name: Enforce full upstream Grease spec outcome separately
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/grease-upstream.status"
          result="$(cat "$RUNNER_TEMP/grease-upstream.status")"
          if test "$result" -ne 0; then
            echo "Upstream cpp-spec was not accepted: status=$result" >&2
            exit "$result"
          fi
