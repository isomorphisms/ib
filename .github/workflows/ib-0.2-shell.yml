name: ib 0.2 shell smoke

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '0.2/**'

jobs:
  shell-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Exercise Cauldron and Pensieve shell boundaries
        run: sh tests/test_0_2_shell.grease
      - name: Exercise deterministic arXiv round trip
        run: sh tests/test_0_2_arxiv_roundtrip.grease
      - name: Exercise rebuildable Pensieve hook
        run: sh tests/test_pensieve_hyperplane_hook.grease
