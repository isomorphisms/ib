name: Idric browser core

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/idric-implementation.md'
      - '.github/workflows/idric-core.yml'

permissions:
  contents: read

jobs:
  idric:
    runs-on: ubuntu-latest
    env:
      IDRIS2_CG: chez
      SCHEME: scheme
      IDRIC_REF: 61970be77769f607cca8650bf424c0f0b22ddee7
    steps:
      - uses: actions/checkout@v4

      - name: Install Chez Scheme
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme

      - name: Restore Idric compiler
        id: idric-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/idric
          key: idric-${{ runner.os }}-61970be77769f607cca8650bf424c0f0b22ddee7

      - name: Build and install Idric compiler
        if: steps.idric-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/isomorphisms/Idric.git /tmp/Idric
          test "$(git -C /tmp/Idric rev-parse HEAD)" = "$IDRIC_REF"
          make -C /tmp/Idric bootstrap PREFIX=/tmp/idric
          make -C /tmp/Idric install PREFIX=/tmp/idric

      - name: Cache Idric compiler
        if: steps.idric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/idric
          key: idric-${{ runner.os }}-61970be77769f607cca8650bf424c0f0b22ddee7

      - name: Compile IB Idric smoke program
        run: |
          set -o pipefail
          /tmp/idric/bin/idris2 src/Smoke.idric -o ib-smoke 2>&1 | tee /tmp/idric-compile.txt
          test -x ./build/exec/ib-smoke
          ! grep -q '^Error:' /tmp/idric-compile.txt

      - name: Exercise browser-owned core
        run: |
          ./build/exec/ib-smoke | tee /tmp/ib-smoke.txt
          grep -Fx 'ingest=3' /tmp/ib-smoke.txt
          grep -Fx 'duplicate-url-count=2' /tmp/ib-smoke.txt
          grep -Fx 'newest-order=2' /tmp/ib-smoke.txt
          grep -Fx 'host-count=2' /tmp/ib-smoke.txt
          grep -Fx 'canonical=canonical' /tmp/ib-smoke.txt
          grep -Fx 'cache-fake=cache' /tmp/ib-smoke.txt
          grep -Fx 'secret=secret' /tmp/ib-smoke.txt
          grep -Fx 'readable-files=2' /tmp/ib-smoke.txt
          grep -Fx 'canonical-files=2' /tmp/ib-smoke.txt

      - name: Compile considered-hook regression
        run: |
          set -o pipefail
          /tmp/idric/bin/idris2 src/ArchiveConsideredTest.idric -o archive-considered-test 2>&1 | tee /tmp/archive-considered-compile.txt
          test -x ./build/exec/archive-considered-test
          ! grep -q '^Error:' /tmp/archive-considered-compile.txt

      - name: Exercise considered-hook policy
        run: |
          ./build/exec/archive-considered-test | tee /tmp/archive-considered-test.txt
          grep -Fx 'before-consider-candidates=0' /tmp/archive-considered-test.txt
          grep -Fx 'consider-alone-candidates=1' /tmp/archive-considered-test.txt
          grep -Fx 'consider-alone-events=1' /tmp/archive-considered-test.txt
          grep -Fx 'consider-alone-known=true' /tmp/archive-considered-test.txt
          grep -Fx 'repeat-same-item-candidates=1' /tmp/archive-considered-test.txt
          grep -Fx 'repeat-same-item-events=2' /tmp/archive-considered-test.txt
          grep -Fx 'second-item-candidates=2' /tmp/archive-considered-test.txt
          grep -Fx 'second-item-events=1' /tmp/archive-considered-test.txt
