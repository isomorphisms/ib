name: Idric browser core

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/idric-implementation.md'
      - 'docs/developer-workbench.md'
      - 'docs/storage-model.md'
      - 'docs/vector-index.md'
      - '.github/workflows/idric-core.yml'

permissions:
  contents: read

jobs:
  idric:
    runs-on: ubuntu-latest
    env:
      IDRIS2_CG: chez
      SCHEME: scheme
      IDRIC_REF: 61970be77769f607cca8650bf424c0f0b22ddee7
    steps:
      - uses: actions/checkout@v4

      - name: Install Chez Scheme
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme

      - name: Restore Idric compiler
        id: idric-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/idric
          key: idric-${{ runner.os }}-61970be77769f607cca8650bf424c0f0b22ddee7

      - name: Build and install Idric compiler
        if: steps.idric-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/Idric
          git -C /tmp/Idric remote add origin https://github.com/isomorphisms/Idric.git
          git -C /tmp/Idric fetch --depth 1 origin "$IDRIC_REF"
          git -C /tmp/Idric checkout --detach FETCH_HEAD
          test "$(git -C /tmp/Idric rev-parse HEAD)" = "$IDRIC_REF"
          make -C /tmp/Idric bootstrap PREFIX=/tmp/idric
          make -C /tmp/Idric install PREFIX=/tmp/idric

      - name: Cache Idric compiler
        if: steps.idric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/idric
          key: idric-${{ runner.os }}-61970be77769f607cca8650bf424c0f0b22ddee7

      - name: Exercise developer workbench
        run: |
          set -o pipefail
          /tmp/idric/bin/idris2 --source-dir src src/Workbench.idric -o ib-workbench 2>&1 | tee /tmp/idric-workbench-compile.txt
          test -x ./build/exec/ib-workbench
          ! grep -q '^Error:' /tmp/idric-workbench-compile.txt
          ./build/exec/ib-workbench | tee /tmp/ib-workbench.txt
          grep -Fx 'fixture-urls=10000' /tmp/ib-workbench.txt
          grep -Fx 'fixture-42=ib://fixture/42' /tmp/ib-workbench.txt
          grep -Fx 'logical-tabs=32' /tmp/ib-workbench.txt
          grep -Fx 'churn-steps=10000' /tmp/ib-workbench.txt
          grep -Fx 'resident-at-3=3' /tmp/ib-workbench.txt
          grep -Fx 'resident-at-10=10' /tmp/ib-workbench.txt

      - name: Compile IB Idric smoke program
        run: |
          set -o pipefail
          /tmp/idric/bin/idris2 --source-dir src src/Smoke.idric -o ib-smoke 2>&1 | tee /tmp/idric-compile.txt
          test -x ./build/exec/ib-smoke
          ! grep -q '^Error:' /tmp/idric-compile.txt

      - name: Compile durable file-store smoke program
        run: |
          set -o pipefail
          /tmp/idric/bin/idris2 --source-dir src src/FileStoreSmoke.idric -o ib-file-store-smoke 2>&1 | tee /tmp/idric-file-store-compile.txt
          test -x ./build/exec/ib-file-store-smoke
          ! grep -q '^Error:' /tmp/idric-file-store-compile.txt

      - name: Exercise file store across process restart
        run: |
          store_root="$(mktemp -d)/state"
          ./build/exec/ib-file-store-smoke write "$store_root" | tee /tmp/ib-file-store-write.txt
          grep -Fx 'write=ok' /tmp/ib-file-store-write.txt
          grep -Fx 'unsafe-path=rejected' /tmp/ib-file-store-write.txt
          grep -Fx 'noncanonical-path=rejected' /tmp/ib-file-store-write.txt
          ./build/exec/ib-file-store-smoke read "$store_root" | tee /tmp/ib-file-store-read.txt
          grep -Fx 'manifest-survived=True' /tmp/ib-file-store-read.txt
          grep -Fx 'history-survived=True' /tmp/ib-file-store-read.txt
          grep -Fx 'history-lines=2' /tmp/ib-file-store-read.txt

      - name: Exercise browser-owned core
        run: |
          ./build/exec/ib-smoke | tee /tmp/ib-smoke.txt
          grep -Fx 'ingest=3' /tmp/ib-smoke.txt
          grep -Fx 'duplicate-url-count=2' /tmp/ib-smoke.txt
          grep -Fx 'newest-order=2' /tmp/ib-smoke.txt
          grep -Fx 'host-count=2' /tmp/ib-smoke.txt
          grep -Fx 'canonical=canonical' /tmp/ib-smoke.txt
          grep -Fx 'cache-fake=cache' /tmp/ib-smoke.txt
          grep -Fx 'secret=secret' /tmp/ib-smoke.txt
          grep -Fx 'readable-files=2' /tmp/ib-smoke.txt
          grep -Fx 'canonical-files=2' /tmp/ib-smoke.txt
          grep -Fx 'copy-label=Copy' /tmp/ib-smoke.txt
          grep -Fx 'copy-target=code-1' /tmp/ib-smoke.txt
          grep -Fx 'copy-payload=git status' /tmp/ib-smoke.txt
          grep -Fx 'vector-backend=flat-f32-exact' /tmp/ib-smoke.txt
          grep -Fx 'vector-scalar=f32' /tmp/ib-smoke.txt
          grep -Fx 'vector-directory=indexes/vectors/pages/test-model' /tmp/ib-smoke.txt
          grep -Fx 'vector-format-readable=True' /tmp/ib-smoke.txt
          grep -Fx 'vector-bytes-readable=False' /tmp/ib-smoke.txt
