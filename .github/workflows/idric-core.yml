name: IB browser foundation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'lib/**'
      - 'tests/**'
      - 'docs/**'
      - '.gitmodules'
      - 'vendor/**'
      - '.github/workflows/idric-core.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IDRIC_REF: 7050c116326c9c8e8d0a56c2db7baf2119cbae19

jobs:
  idric-core:
    runs-on: ubuntu-latest
    env:
      IDRIS2_CG: chez
      SCHEME: scheme
      IDRIC_REF: 7050c116326c9c8e8d0a56c2db7baf2119cbae19
    steps:
      - name: Check out exact IB source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact IB source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Reject inherited vocabulary on public Idriç surfaces
        run: |
          sh tests/idric-public-vocabulary-self-test.sh
          sh tests/idric-public-vocabulary.sh

      - name: Checkout canonical hostile-input corpus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: c1e423d506f6adfc8c1c9659a4faaf94ae84eaf0
          path: .tools/ai-ci

      - name: Install system dependencies through Grease
        run: sh bin/ci_browser_foundation.grease install-dependencies

      - name: Restore Idriç compiler
        id: idric-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: /tmp/idric
          key: idric-relocatable-v2-${{ runner.os }}-7050c116326c9c8e8d0a56c2db7baf2119cbae19

      - name: Build and install Idriç compiler through Grease
        if: steps.idric-cache.outputs.cache-hit != 'true'
        run: sh bin/ci_browser_foundation.grease build-idric

      - name: Cache Idriç compiler
        if: steps.idric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: /tmp/idric
          key: idric-relocatable-v2-${{ runner.os }}-7050c116326c9c8e8d0a56c2db7baf2119cbae19

      - name: Exercise HTML-first information renderer
        run: sh bin/ci_browser_foundation.grease exercise-information

      - name: Exercise pinned hostile-input document receipts
        run: sh bin/ci_browser_foundation.grease exercise-hostile-ingestion

      - name: Exercise the pinned reusable AICI action
        uses: isomorphisms/ai-ci/ingestion@c1e423d506f6adfc8c1c9659a4faaf94ae84eaf0
        with:
          receipt: /tmp/ib-valid-ingestion.receipt.tsv
          role: consumer

      - name: Exercise canonical information model
        working-directory: src
        run: |
          /tmp/idric/bin/idris2 CanonicalInformationSmoke.idric -o ib-canonical-information > /tmp/idric-canonical-information-compile.txt 2>&1
          cat /tmp/idric-canonical-information-compile.txt
          test -x ./build/exec/ib-canonical-information
          ! grep -q '^Error:' /tmp/idric-canonical-information-compile.txt
          ./build/exec/ib-canonical-information > /tmp/ib-canonical-information.txt
          cat /tmp/ib-canonical-information.txt
          grep -Fx 'canonical-information=constructed' /tmp/ib-canonical-information.txt
          grep -Fx 'canonical-blocks=6' /tmp/ib-canonical-information.txt
          grep -Fx 'canonical-row-cells=2' /tmp/ib-canonical-information.txt
          grep -Fx 'empty-image-refused=True' /tmp/ib-canonical-information.txt
          grep -Fx 'seventh-heading-refused=True' /tmp/ib-canonical-information.txt
          grep -Fx 'revision-zero=0' /tmp/ib-canonical-information.txt
          grep -Fx 'nonincreasing-revision-refused=True' /tmp/ib-canonical-information.txt
          grep -Fx 'version1=serialized' /tmp/ib-canonical-information.txt

      - name: Exercise browser-owned Idriç core
        run: sh bin/ci_browser_foundation.grease exercise-core

      - name: Exercise developer workbench
        run: sh bin/ci_browser_foundation.grease exercise-workbench

  scientific-media:
    runs-on: ubuntu-latest
    env:
      PDF_HARVESTER_REF: 77d85dc6f7e89d109cb9e06f42706bc34f00e4a3
    steps:
      - name: Check out exact IB source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false

      - name: Verify exact IB source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install system dependencies through Grease
        run: sh bin/ci_browser_foundation.grease install-dependencies

      - name: Restore Idriç compiler for PDF caption bridge
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: /tmp/idric
          key: idric-relocatable-v2-${{ runner.os }}-7050c116326c9c8e8d0a56c2db7baf2119cbae19

      - name: Verify PDF harvester pin
        run: sh bin/ci_browser_foundation.grease verify-pdf-harvester

      - name: Exercise deterministic scientific image harvesting
        run: sh bin/ci_browser_foundation.grease exercise-scientific-media

      - name: Exercise live arXiv HTML-first harvesting
        run: sh bin/ci_browser_foundation.grease exercise-live-arxiv

      - name: Exercise live arXiv progressive pre-paint
        run: sh bin/ci_browser_foundation.grease exercise-live-arxiv-prepaint
