name: IB scholarly source recovery
on:
  pull_request:
    paths:
      - 'src/IB/Scholarly*.idric'
      - 'src/Scholarly*.idric'
      - 'src/IB/WebSearch.idric'
      - 'lib/scholarly_*.grease'
      - 'tests/test_scholarly_*.grease'
      - 'android-native/**'
      - 'native/android/ib_reader_workbench.c'
      - 'examples/autogenerated/native-reader/NativeReader.idric'
      - '.github/workflows/ib-scholarly-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Retain investigations and refuse event conflicts
        run: sh tests/test_scholarly_investigation.grease
      - name: Keep summary proposals source-scoped
        run: sh tests/test_scholarly_summary.grease
      - name: Preserve reader resource identity
        run: |
          grep -F '0x7f030012' android-native/res/values/public.xml
          grep -F 'scholarlyStatus' native/android/ib_reader_workbench.c
          grep -F 'scholarlyStatus' examples/autogenerated/native-reader/NativeReader.idric
  checked-semantics:
    runs-on: ubuntu-24.04
    env:
      IDRIS2_CG: chez
      SCHEME: scheme
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve Idric public vocabulary
        run: |
          sh tests/idric-public-vocabulary-self-test.sh
          sh tests/idric-public-vocabulary.sh
      - name: Restore maintained host compiler dependencies
        run: sh bin/ci_browser_foundation.grease install-dependencies
      - name: Restore pinned Idric compiler
        id: idric-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: /tmp/idric
          key: idric-relocatable-v2-${{ runner.os }}-7050c116326c9c8e8d0a56c2db7baf2119cbae19
      - name: Build pinned Idric compiler if missing
        if: steps.idric-cache.outputs.cache-hit != 'true'
        run: sh bin/ci_browser_foundation.grease build-idric
      - name: Compile and execute four semantic acceptance programs
        run: |
          cd src
          for name in ScholarlyAccess ScholarlyDiscovery ScholarlyEvidence ScholarlySummary; do
            /tmp/idric/bin/idris2 "${name}Smoke.idric" -o "ib-${name}" > "/tmp/${name}.compile.log" 2>&1 || { cat "/tmp/${name}.compile.log"; exit 1; }
            cat "/tmp/${name}.compile.log"
            "./build/exec/ib-${name}" | tee "/tmp/${name}.run.log"
            short=$(printf '%s' "$name" | sed 's/^Scholarly//' | tr '[:upper:]' '[:lower:]')
            grep -Fx "scholarly-$short=PASS" "/tmp/${name}.run.log"
          done
