name: Retain the exact native IB APK candidate
on:
  pull_request:
    paths:
      - '.github/workflows/ib-candidate-delivery.yml'
      - 'examples/autogenerated/ib-apk-delivery/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ib-apk-candidate-delivery
  cancel-in-progress: false
jobs:
  candidate:
    if: github.head_ref == 'delivery/ib-reader-a7349efc' || github.ref_name == 'delivery/ib-reader-a7349efc'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DELIVERY_BRANCH: delivery/ib-reader-a7349efc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Prepare the declared Cat Food Grease runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the declared receipt text verifier
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 platforms;android-34'
      - name: Parse the Grease publisher before any artifact or Git operation
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -n examples/autogenerated/ib-apk-delivery/publish.grease > "$RUNNER_TEMP/ib-APK-publisher.syntax.txt"
      - name: Verify and retain the exact existing signed APK without repackaging
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/ib-apk-delivery/publish.grease "$ANDROID_HOME" "$DELIVERY_HEAD" "$RUNNER_TEMP/ib-direct-APK"
      - name: Retain bounded publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-direct-APK-publication-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ib-direct-APK/signature.txt
            ${{ runner.temp }}/ib-direct-APK/badging.txt
            ${{ runner.temp }}/ib-direct-APK/ib-reader-a7349efc.receipt.tsv
            ${{ runner.temp }}/ib-direct-APK/published-sha
            ${{ runner.temp }}/ib-direct-APK/direct-APK-URL.txt
          if-no-files-found: warn
