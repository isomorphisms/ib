name: IB integrated checked tablet reader
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-to-dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=0
      IB_GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 6ab4818219efa7ea5eda137ca6b76976eb2a4d42
          path: .tools/android-NDK
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: ac06d67dd82cdf82c59ea06f9378ddccb09e8bc7
          path: .tools/reader-acceptance
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Provision the exact host orchestration runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: sh .tools/catfood/build-tools.sh
      - name: Restore pinned frontend bootstrap
        id: frontend
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Bootstrap the checked frontend with ICK
        if: steps.frontend.outputs.cache-hit != 'true'
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Retain exact frontend bootstrap
        if: steps.frontend.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.frontend.outputs.cache-primary-key }}
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Prepare the merged compiler
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/tabp10-reader/prepare.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/android-NDK" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/ib-reader"
      - name: Compile maintained IB consumers and integrated Prepaint
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/tabp10-reader/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/android-NDK" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/ib-reader"
      - name: Exercise the maintained native ingress boundary
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/tabp10-reader/verify-native.grease "$GITHUB_WORKSPACE" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/ib-reader/native"
      - name: Prepare emulator KVM access
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - name: Independently execute actual IB consumers and compiled mutants on API 29
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: '29'
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1024 -gpu swiftshader_indirect
          disable-animations: true
          script: .tools/runtime/.build/grease/bin/grease examples/autogenerated/tabp10-reader/observe.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-reader" "$ANDROID_HOME/platform-tools/adb" "$RUNNER_TEMP/ib-reader/art-api29"
      - name: Independently execute actual IB consumers and compiled mutants on API 34
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: '34'
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1024 -gpu swiftshader_indirect
          disable-animations: true
          script: .tools/runtime/.build/grease/bin/grease examples/autogenerated/tabp10-reader/observe.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ib-reader" "$ANDROID_HOME/platform-tools/adb" "$RUNNER_TEMP/ib-reader/art-api34"
      - name: Preserve exact compiler for independent replay
        if: always()
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/tabp10-reader/bundle.grease "$GITHUB_WORKSPACE/.tools/android-NDK" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/ib-reader"
      - name: Preserve source-bound evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-tabp10-reader-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ib-reader
          if-no-files-found: warn
