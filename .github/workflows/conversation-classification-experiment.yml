name: Conversation classification experiment

on:
  push:
    branches:
      - experiment/conversation-classification-corpus
    paths:
      - 'experiments/conversation-classification/**'
      - '.github/workflows/conversation-classification-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: [self-hosted, linux, debian]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify disposable reference dependencies
        run: python3 -c 'import joblib, numpy, scipy, sklearn; print(numpy.__version__, scipy.__version__, sklearn.__version__)'

      - name: Run conversation experiment tests
        working-directory: experiments/conversation-classification
        run: python3 -m unittest discover -s tests -p 'test_*.py'
