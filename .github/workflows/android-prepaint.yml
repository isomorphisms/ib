name: Android prepaint viewer

env:
  NDK_VERSION: "27.2.12479018"

on:
  push:
    paths:
      - "android-prepaint/**"
      - "docs/prepaint-display-contract.md"
      - ".github/workflows/android-prepaint.yml"
  pull_request:
    paths:
      - "android-prepaint/**"
      - "docs/prepaint-display-contract.md"
      - ".github/workflows/android-prepaint.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-prepaint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test D boundary, lint, and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:verifyPrepaintBoundary

      - uses: actions/upload-artifact@v4
        with:
          name: ib-d-native-armv7-apk
          path: android-prepaint/app/build/outputs/apk/debug/app-debug.apk
