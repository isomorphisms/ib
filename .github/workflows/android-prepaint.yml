name: Android prepaint viewer

on:
  push:
    paths:
      - "android-prepaint/**"
      - "docs/prepaint-display-contract.md"
      - ".github/workflows/android-prepaint.yml"
  pull_request:
    paths:
      - "android-prepaint/**"
      - "docs/prepaint-display-contract.md"
      - ".github/workflows/android-prepaint.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      IB_TEST_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      IB_TEST_KEYSTORE_PASSWORD: wegert-debug
      IB_TEST_KEY_PASSWORD: wegert-debug
      IB_TEST_KEY_ALIAS: wegert-debug
      IB_EXPECTED_CERT_SHA256: DE:9B:1D:47:C5:A6:5E:6D:46:A2:04:B7:9D:D9:EE:56:6B:9D:3C:98:32:BA:81:EB:C4:21:3D:33:92:E9:2F:F9
    defaults:
      run:
        working-directory: android-prepaint
    steps:
      - uses: actions/checkout@v4

      - name: Check out stable public test signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Exercise typed prepaint model and compile refusals
        run: sh tests/verify_typed_model.sh

      - name: Verify stable test signing identity
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$IB_TEST_KEYSTORE" \
            -storepass "$IB_TEST_KEYSTORE_PASSWORD" \
            -alias "$IB_TEST_KEY_ALIAS" \
            | grep -F "SHA256: $IB_EXPECTED_CERT_SHA256"

      - name: Test, lint, and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:verifyPrepaintBoundary

      - name: Verify APK signer
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$sdk_root/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
            | tee /tmp/ib-prepaint-signing.txt
          expected="$(printf '%s' "$IB_EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          grep -Fq "Signer #1 certificate SHA-256 digest: $expected" /tmp/ib-prepaint-signing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ib-prepaint-viewer-apk
          path: android-prepaint/app/build/outputs/apk/debug/app-debug.apk

  replacement-install:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ib-prepaint-viewer-apk
          path: downloaded-apk

      - name: Install and replace without uninstall
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install -r downloaded-apk/app-debug.apk
            adb install -r downloaded-apk/app-debug.apk
            adb shell am start -W -n org.isomorphisms.ib.prepaint/.PrepaintActivity | tee /tmp/ib-prepaint-start.txt
            grep -Fq 'Status: ok' /tmp/ib-prepaint-start.txt
            test -n "$(adb shell pidof org.isomorphisms.ib.prepaint | tr -d '\r')"
