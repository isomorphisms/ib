name: Temporary Idriç terminology repair

on:
  push:
    branches:
      - docs/idric-terminology-audit

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/idric-terminology-audit
          fetch-depth: 0

      - name: Correct integration comments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/pdf_figure_captions.grease')
          text = path.read_text()
          replacements = [
              ('performed by Idric through PDF.Figure', 'performed by Idriç through PDF.Figure'),
              ('vendored Idric association rule', 'vendored Idriç association rule'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected text not found: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name 'isomorphisms terminology audit'
          git config user.email 'isomorphisms@users.noreply.github.com'
          git add lib/pdf_figure_captions.grease
          git diff --cached --check
          git commit -m 'Normalize Idriç integration prose'
          git push origin HEAD:docs/idric-terminology-audit
