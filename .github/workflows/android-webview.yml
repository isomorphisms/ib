name: Android WebView protected transaction

on:
  workflow_dispatch:
  push:
    paths:
      - "android-webview/**"
      - ".github/workflows/android-webview.yml"
  pull_request:
    paths:
      - "android-webview/**"
      - ".github/workflows/android-webview.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-webview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test, lint, and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:verifyWebViewBoundary

      - uses: actions/upload-artifact@v4
        with:
          name: ib-webview-protected-transaction-apk
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
