name: First-party Google browser adapter qualification
on:
  pull_request:
    paths:
      - '.github/workflows/google-browser-probe.yml'
      - 'examples/autogenerated/google-browser/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0
      IB_GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 153e7fc8053ba4072954a5e77d4efa3609d829e4
          path: .tools/android-NDK
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build declared Grease runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the declared text verifier
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update; sudo apt-get install --no-install-recommends -y ripgrep'
      - name: Restore exact checked frontend
        id: frontend
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Bootstrap exact checked frontend if absent
        if: steps.frontend.outputs.cache-hit != 'true'
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Prepare the checked DEX compiler
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/tabp10-reader/prepare.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/android-NDK" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/google-browser/compiler"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 platforms;android-34'
      - name: Build checked framework probe and stable signed qualification APK
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/google-browser/build.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/android-NDK" "$GITHUB_WORKSPACE/.tools/Idric" "$ANDROID_HOME" "$RUNNER_TEMP/google-browser/candidate"
      - name: Retain exact probe inputs and outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Google-browser-qualification-build
          path: |
            ${{ runner.temp }}/google-browser/candidate/package
            ${{ runner.temp }}/google-browser/candidate/sha256.txt
            ${{ runner.temp }}/google-browser/candidate/ib-commit.txt
            ${{ runner.temp }}/google-browser/candidate/*compiler.txt
          if-no-files-found: warn
  observe:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 185cdaae32dcd5247e4e84fa2d0643b90f645d6f
          path: .tools/observer
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build declared observation runtime
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install independent HTML verifier and prepare KVM
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep libxml2-utils
          sudo chmod 666 /dev/kvm'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Google-browser-qualification-build
          path: ${{ runner.temp }}/google-browser-input
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 platforms;android-34'
      - name: Observe the real first-party frontend under ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          avd-name: Google-probe-api${{ matrix.api }}
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: .tools/runtime/.build/grease/bin/grease examples/autogenerated/google-browser/observe.grease "$GITHUB_WORKSPACE/.tools/observer" "$GITHUB_WORKSPACE/.tools/runtime/.build/grease/bin/grease" "$RUNNER_TEMP/google-browser-input/package/ib-material-reader.apk" "$ANDROID_HOME" "${{ matrix.api }}" "$RUNNER_TEMP/google-browser-observed"
      - name: Retain bounded private DOM and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Google-browser-observed-api${{ matrix.api }}
          path: ${{ runner.temp }}/google-browser-observed
          if-no-files-found: warn
